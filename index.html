<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ruby 🎉</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        height: 100vh;
        overflow: hidden;
        color: white;
        text-align: center;
    }

    .container {
        position: relative;
        top: 50%;
        transform: translateY(-50%);
        padding: 20px;
    }

    h1 {
        font-size: 3em;
        margin-bottom: 10px;
        animation: glow 2s infinite alternate;
    }

    h2 {
        font-size: 2em;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.2em;
        max-width: 600px;
        margin: auto;
        line-height: 1.6;
    }

    .heart {
        font-size: 50px;
        animation: heartbeat 1.5s infinite;
        margin: 20px 0;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        font-size: 1em;
        border: none;
        border-radius: 25px;
        background: white;
        color: #ff4f81;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff4f81;
        color: white;
    }

    @keyframes heartbeat {
        0% { transform: scale(1); }
        25% { transform: scale(1.2); }
        50% { transform: scale(1); }
        75% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 25px #ffdde1; }
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        animation: fall 5s linear infinite;
        opacity: 0.7;
    }

    @keyframes fall {
        0% { transform: translateY(-100vh) rotate(0deg); }
        100% { transform: translateY(100vh) rotate(360deg); }
    }
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Happy Birthday 🎉</h1>
    <h2>Ruby Yadav 💖</h2>

    <div class="heart">❤️</div>
